# 宿主机 Nginx —— 这台服务器上两个项目共用的入口。
#
# 为什么需要它：80 端口只能有一个主人。mall-resume 的商城容器原先直接绑
# 0.0.0.0:80，而它的 server_name 是 `_`，于是域名 clstudy.online 被它兜住，
# 打开的是商城。商城的 Nginx 配置是烤在镜像里的、没有挂载，没法往它里面加
# 虚拟主机 —— 所以只能从端口层面解：商城退到 127.0.0.1:8090，由这里按
# server_name 分流。
#
#   clstudy.online / www   → 记事本（127.0.0.1:8082）
#   其余（含直接访问 IP）   → 商城（127.0.0.1:8090）
#
# 两个项目的对外地址都没变：商城仍是 http://47.242.4.27，记事本拿到域名。
#
# 落地位置：/etc/nginx/conf.d/notepad.conf
#   scp -i ~/.ssh/id_rsa_aliyun deploy/host-nginx/notepad.conf root@47.242.4.27:/etc/nginx/conf.d/
#
# ⚠️ 同时必须注释掉 /etc/nginx/nginx.conf 里内置的那个默认 server
#    （`listen 80; server_name _; root /usr/share/nginx/html;`），否则 80 端口上
#    会有两个默认 server，nginx 报 conflicting server name 并且行为不确定。
#
# ⚠️ 本文件在 http 上下文里被 include（nginx.conf 的 `include /etc/nginx/conf.d/*.conf;`
#    写在 http{} 内），所以下面这个 map 放这里合法 —— 但不能再有第二个文件定义同名 map。

# WebSocket 升级用的变量。nginx 只自带 $http_upgrade，$connection_upgrade 必须自己 map 出来：
#   WebSocket 握手 → Upgrade；普通请求 → close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# 记事本：clstudy.online
# ---------------------------------------------------------------------------

server {
    listen       80;
    listen       [::]:80;
    server_name  clstudy.online www.clstudy.online;

    # ACME 验证文件的落点，certbot 用 --webroot 往 /var/www/certbot 里写。
    # 必须排在 location / 之前，且用 ^~ 挡掉后面的正则匹配 —— 否则会被下面的
    # 301 抢先，证书续期会失败。而续期 cron 是 --quiet 的，失败了没有任何提示，
    # 等发现时证书已经过期了。
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        access_log   off;
    }

    # 全站跳 HTTPS。证书没就绪之前不要打开这一行，否则域名会直接打不开。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  clstudy.online www.clstudy.online;

    ssl_certificate     /etc/letsencrypt/live/clstudy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clstudy.online/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    # 整站转给记事本自己的 Nginx（容器 notepad-web，宿主机 8082）。
    # /api/ 和 /uploads/ 的路由由容器内那份 deploy/nginx/conf.d/notepad.conf 负责，
    # 这里**不要**重复写一遍 —— 两处都写迟早会漂移。
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # X-Real-IP 必须是 $remote_addr（即真实客户端），且下游要原样透传不能覆盖，
        # 后端的登录限流就是靠这个头区分用户的。链路见 deploy/nginx/conf.d/notepad.conf
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 这一层也必须关缓冲。AI 问答和 AI 编辑预览走 SSE 流式返回，
        # 宿主机这一层默认会把响应攒够一块才转发，「逐字显示」会退化成
        # 「转半天圈然后整段答案一次性冒出来」。容器内那层已经关了，这层不能漏。
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Accept-Encoding "";
    }
}

# ---------------------------------------------------------------------------
# 商城 mall-resume：默认 server，直接访问 IP 时落到这里
# ---------------------------------------------------------------------------

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    # 商城后端允许 50m 的上传
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        # 商城前端有 /ws/ WebSocket，下面三行缺一不可，否则长连接会静默降级
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
