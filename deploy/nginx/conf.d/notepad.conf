server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 前端用 createWebHistory()，刷新子路由必须回退到 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口。
    # proxy_pass 末尾千万不能加斜杠：加了会把 /api/notes 变成 /notes 导致 404
    location /api/ {
        proxy_pass http://notepad-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 必须剥掉 Origin：后端有个 CorsFilter 只放行 localhost，
        # 而浏览器的 POST 即使同源也会带 Origin 头，会被它判成非法跨域直接 403。
        # 这里前后端同域，后端本来就不需要处理 CORS，去掉这个头即可。
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # SSE 流式接口（AI 问答、AI 编辑预览）必须关掉代理缓冲，
        # 否则 Nginx 会攒够一整块才转发，前端就不再逐字显示。
        # proxy_read_timeout 也要调大，默认 60 秒会掐断长回答。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Accept-Encoding "";
    }

    # 上传的图片同样转发给后端（后端会做登录态与归属校验）
    location /uploads/ {
        proxy_pass http://notepad-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
    }

    client_max_body_size 20m;
}
