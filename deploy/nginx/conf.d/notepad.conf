server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 前端用 createWebHistory()，刷新子路由必须回退到 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口。
    # proxy_pass 末尾千万不能加斜杠：加了会把 /api/notes 变成 /notes 导致 404
    location /api/ {
        proxy_pass http://notepad-backend:8080;
        proxy_set_header Host $host;

        # ⚠️ 这里必须是 $http_x_real_ip（透传上游），**不能**写成 $remote_addr。
        # 生产环境外面还有一层宿主机 Nginx（见 deploy/host-nginx/notepad.conf），
        # 到了这一层 $remote_addr 已经是 127.0.0.1，写 $remote_addr 会把宿主机传来的
        # 真实客户端 IP 覆盖掉；而后端 ClientIpResolver 优先读 X-Real-IP ——
        # 后果是所有访客共用一个限流桶，演示账号连错 5 次就把全站所有人锁在门外。
        # 空值 nginx 会直接不发这个头，所以直连 :8082 时会自动退回下面的 XFF/remoteAddr。
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 同理透传，别用 $scheme（在这一层恒为 http），否则后端 isSecure() 永远为 false
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 必须剥掉 Origin：后端有个 CorsFilter 只放行 localhost，
        # 而浏览器的 POST 即使同源也会带 Origin 头，会被它判成非法跨域直接 403。
        # 这里前后端同域，后端本来就不需要处理 CORS，去掉这个头即可。
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # SSE 流式接口（AI 问答、AI 编辑预览）必须关掉代理缓冲，
        # 否则 Nginx 会攒够一整块才转发，前端就不再逐字显示。
        # proxy_read_timeout 也要调大，默认 60 秒会掐断长回答。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Accept-Encoding "";
    }

    # 上传的图片同样转发给后端（后端会做登录态与归属校验）
    location /uploads/ {
        proxy_pass http://notepad-backend:8080;
        proxy_set_header Host $host;
        # 同上：透传上游的真实 IP，不要用 $remote_addr
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
    }

    client_max_body_size 20m;
}
