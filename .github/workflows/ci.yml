name: CI

# 只跑「不需要外部依赖」的检查：单元测试全部 Mock 掉了数据库、模型调用和邮件，
# 前端构建也不需要后端在线。所以这个工作流不配任何密钥、不烧 AI 额度，
# 任何人都能复现 —— 这正是它和 backend/scripts/verify-*.sh 的区别：
# 那批是端到端验收脚本，需要真实环境，进不了 CI。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端 · 编译 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 运行单元测试
        working-directory: backend
        run: mvn -B test

      - name: 上传测试报告
        # 测试失败时也要能看到哪个用例挂了
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端 · 类型检查 + 生产构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: notepadweb/package-lock.json

      - name: 安装依赖
        working-directory: notepadweb
        run: npm ci

      # package.json 的 build 是 `vue-tsc -b && vite build`，
      # 类型检查和构建一次跑完；类型错误会直接让这一步失败
      - name: 类型检查并构建
        working-directory: notepadweb
        run: npm run build
